name: Data and monitor tests

on:
  push:
    branches:
      - main
      - arena/7906522c-scoringdiscrepnba
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curated records
        run: python tools/validate_data.py
      - name: Run offline monitor tests
        run: python -m unittest discover -s tests -v
      - name: Build Pages artifact
        run: python tools/build_site.py --root . --output _site
