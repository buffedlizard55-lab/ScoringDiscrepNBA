name: Validate research data

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate case files (anti-hallucination gate)
        run: python3 scripts/validate.py
      - name: Monitor offline self-test
        run: python3 scripts/monitor.py --self-test
      - name: Rebuild stats + site data and check for drift
        run: |
          python3 scripts/compute_stats.py
          python3 scripts/build_site_data.py
          git status --porcelain -- data docs/data | tee /tmp/drift.txt
          if [ -s /tmp/drift.txt ]; then
            echo "::error::Generated data is out of date. Run compute_stats.py + build_site_data.py and commit."
            exit 1
          fi
