name: Verify research data and monitor

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check active and historical dashboard JavaScript syntax
        run: |
          node --check assets/app.js
          node --check docs/app.js
      - name: Smoke-test dashboard data rendering
        run: node tests/dashboard-smoke.js
      - name: Compile active and retained Python tools/tests
        run: python3 -m compileall -q monitor scripts src tests
      - name: Validate data contracts and source links
        run: python3 -m monitor --check-data
      - name: Run offline monitor tests
        run: python3 -m unittest discover -s tests -v
