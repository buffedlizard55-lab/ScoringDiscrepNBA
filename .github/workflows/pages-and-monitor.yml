name: Publish research site and monitor NBA scores

on:
  push:
    branches: [main]
    # Scheduled polls publish the heartbeat/site themselves; avoid a second
    # Pages deployment when their only commit is monitor-owned JSON state.
    paths-ignore:
      - "data/live-feed.json"
      - "data/monitor-state.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-monitor
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run scheduled source comparison
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 -m monitor --live

      - name: Run data integrity checks
        run: |
          python3 -m compileall -q monitor
          python3 -m monitor --check-data

      - name: Create or refresh persistent-candidate issue alerts
        id: github_alerts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('node:path');
            const workspace = process.env.GITHUB_WORKSPACE;
            const { notifyAlerts } = require(path.join(workspace, 'scripts/github_alerts.js'));
            await notifyAlerts({
              github,
              context,
              logger: core,
              statePath: path.join(workspace, 'data/monitor-state.json'),
            });

      - name: Report GitHub issue alert transport failure
        if: steps.github_alerts.outcome == 'failure'
        run: echo "::warning::Score observations were saved, but GitHub issue notifications failed. See the previous step; the next scheduled run will retry."

      - name: Detect material monitor-ledger updates
        id: changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          material_changes="$(python3 scripts/monitor_diff.py)"
          echo "changed=$material_changes" >> "$GITHUB_OUTPUT"

      - name: Persist changed observation and alert state
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-feed.json data/monitor-state.json
          git commit -m "chore: update NBA score observations"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage static dashboard files
        run: |
          mkdir -p _site
          cp index.html README.md .nojekyll _site/
          cp -R assets data docs _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
