name: Deploy site

on:
  push:
    branches: [main]
    paths: ["docs/**", "data/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild site data bundle
        run: |
          python3 scripts/compute_stats.py
          python3 scripts/build_site_data.py
      # Keep the prior session's (PR #2) datasets downloadable from the deployed site.
      - name: Bundle legacy datasets for download
        run: |
          mkdir -p docs/legacy
          for f in discrepancies.json statistics.json latest_check.json live_alerts.json; do
            cp "data/$f" "docs/legacy/$f" 2>/dev/null || echo "absent: data/$f"
          done
          ls -lh docs/ docs/legacy/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
