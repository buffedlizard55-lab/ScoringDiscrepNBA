name: NBA score monitor and Pages deploy

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scoringdiscrepnba-pages
  cancel-in-progress: false

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the fixed Arena session branch
        uses: actions/checkout@v4
        with:
          ref: arena/7906522c-scoringdiscrepnba
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync current main content into the durable session branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
      - name: Validate records and monitor logic
        run: |
          python tools/validate_data.py
          python -m unittest discover -s tests -v
      - name: Compare public score feeds
        run: python tools/monitor_scores.py --root .
      - name: Persist meaningful observations on the session branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor/state.json data/monitor/candidates.json data/monitor/observations.jsonl
          if git diff --cached --quiet; then
            echo "No new source-score transition; no durable observation commit needed."
          else
            git commit -m "Record NBA score monitor observation"
          fi
          # Push only to the fixed Arena session branch. This also persists a clean
          # main-to-session-branch sync when the observation set itself did not change.
          git push origin HEAD:refs/heads/arena/7906522c-scoringdiscrepnba
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build the public site artifact
        run: python tools/build_site.py --root . --output _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
